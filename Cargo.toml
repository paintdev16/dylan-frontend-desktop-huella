[package]
name = "dylan-frontend-desktop-huella"
version = "0.1.2"
edition = "2024"

[dependencies]
gpui-kit = "0.10.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4"] }
velopack = "=1.2.161"

[target.'cfg(target_os = "windows")'.dependencies]
async-channel = "2.5.0"
libloading = "0.8.9"
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0.12"
