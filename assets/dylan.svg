<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 84 500 410" width="500" height="410" role="img" aria-label="Logo Dylan Restaurante">
  <title>Dylan Restaurante - Logotipo Vectorial (Fondo Transparente)</title>

  <defs>
    <!-- Degradado verde bosque elegante (letra D y título DYLAN) -->
    <linearGradient id="forestGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e6b48" />
      <stop offset="45%" stop-color="#3b5436" />
      <stop offset="100%" stop-color="#273a24" />
    </linearGradient>

    <!-- Brillo sutil superior para el texto verde -->
    <linearGradient id="greenHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6f8f68" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1c2a1a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Degradado cobre / bronce metálico (cubiertos, curva D, ondas y subtítulo) -->
    <linearGradient id="copperMetal" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#f3c699" />
      <stop offset="28%" stop-color="#d8925e" />
      <stop offset="55%" stop-color="#b56b3d" />
      <stop offset="80%" stop-color="#e3a472" />
      <stop offset="100%" stop-color="#8c4823" />
    </linearGradient>

    <!-- Degradado cobre más cálido para la cuchara y destellos -->
    <linearGradient id="copperWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d2ab" />
      <stop offset="40%" stop-color="#d68b57" />
      <stop offset="75%" stop-color="#a85b30" />
      <stop offset="100%" stop-color="#7c3c1b" />
    </linearGradient>

    <!-- Sombra proyectada realista para efecto 3D en relieve -->
    <filter id="dropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b0d0f" flood-opacity="0.65" />
    </filter>

    <!-- Sombra más sutil para detalles pequeños -->
    <filter id="softShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b0d0f" flood-opacity="0.6" />
    </filter>

    <!-- Trayectoria en arco para el texto curvado "RESTAURANTE" -->
    <path id="restauranteArc" d="M 278,382 A 148,138 0 0,0 522,382" fill="none" />

    <!-- Máscara transparente para el cruce limpio de la cuchara sobre la "D" y el tenedor -->
    <mask id="spoonCutoutMask" maskUnits="userSpaceOnUse" x="-160" y="-160" width="320" height="320">
      <rect x="-160" y="-160" width="320" height="320" fill="#ffffff" />
      <g transform="rotate(42)">
        <path
          d="M 0,-102
             C 15,-102 22,-84 20,-64
             C 18.5,-48 11,-38 6,-32
             L 8.5,76
             C 8.8,84 4.5,89 0,89
             C -4.5,89 -8.8,84 -8.5,76
             L -6,-32
             C -11,-38 -18.5,-48 -20,-64
             C -22,-84 -15,-102 0,-102
             Z"
          fill="#000000"
          stroke="#000000"
          stroke-width="7"
          stroke-linejoin="round"
        />
      </g>
    </mask>
  </defs>

  <!-- =========================================================
       1. ISOTIPO SUPERIOR: LETRA "D" + TENEDOR Y CUCHARA (SIN FONDO)
       ========================================================= -->
  <g transform="translate(400, 178)" filter="url(#dropShadow)">

    <!-- Grupo enmascarado para que el espacio alrededor de la cuchara sea transparente -->
    <g mask="url(#spoonCutoutMask)">
      <!-- Parte VERDE de la letra "D" (asta vertical izquierda y arco superior) -->
      <path
        d="M -46,-68
           L -6,-68
           C 18,-68 38,-60 50,-46
           L 33,-30
           C 24,-43 10,-50 -8,-50
           L -14,-50
           L -14,22
           L -34,42
           L -34,-54
           C -34,-60 -39,-63 -46,-64
           Z"
        fill="url(#forestGreen)"
        stroke="url(#greenHighlight)"
        stroke-width="1.2"
        stroke-linejoin="round"
      />

      <!-- Parte COBRE de la letra "D" (arco inferior derecho que completa la letra) -->
      <path
        d="M 57,-26
           C 66,-6 65,24 49,45
           C 35,62 12,70 -16,70
           L -24,70
           L -10,52
           C 10,52 26,46 35,33
           C 45,19 46,-2 41,-15
           Z"
        fill="url(#copperMetal)"
        stroke="#f7d5b2"
        stroke-opacity="0.35"
        stroke-width="1"
        stroke-linejoin="round"
      />

      <!-- TENEDOR (diagonal de arriba-izquierda hacia abajo-derecha) -->
      <g transform="rotate(-40)">
        <path
          d="M -14.5,-94
             C -14.5,-97 -11.5,-97 -11.5,-94
             L -11.5,-58
             C -11.5,-55 -7.5,-55 -7.5,-58
             L -7.5,-95
             C -7.5,-98 -4.5,-98 -4.5,-95
             L -4.5,-58
             C -4.5,-55 -0.5,-55 -0.5,-58
             L -0.5,-95
             C -0.5,-98 2.5,-98 2.5,-95
             L 2.5,-58
             C 2.5,-55 6.5,-55 6.5,-58
             L 6.5,-94
             C 6.5,-97 9.5,-97 9.5,-94
             L 9.5,-56
             C 9.5,-44 3,-38 2,-30
             L 5,56
             C 5.2,61 1.5,64 -2.5,64
             C -6.5,64 -10.2,61 -10,56
             L -7,-30
             C -8,-38 -14.5,-44 -14.5,-56
             Z"
          fill="url(#copperMetal)"
          stroke="#f7d5b2"
          stroke-opacity="0.3"
          stroke-width="0.9"
        />
      </g>
    </g>

    <!-- CUCHARA (diagonal de arriba-derecha hacia abajo-izquierda, pasa sobre el tenedor y la D) -->
    <g transform="rotate(42)">
      <!-- Silueta principal de la cuchara en cobre -->
      <path
        d="M 0,-102
           C 15,-102 22,-84 20,-64
           C 18.5,-48 11,-38 6,-32
           L 8.5,76
           C 8.8,84 4.5,89 0,89
           C -4.5,89 -8.8,84 -8.5,76
           L -6,-32
           C -11,-38 -18.5,-48 -20,-64
           C -22,-84 -15,-102 0,-102
           Z"
        fill="url(#copperWarm)"
        stroke="#fae0c3"
        stroke-opacity="0.45"
        stroke-width="1"
      />

      <!-- Reflejo interno suave en el cuenco de la cuchara -->
      <ellipse cx="-4" cy="-73" rx="6" ry="16" fill="#fff1e0" opacity="0.16" />
    </g>
  </g>

  <!-- =========================================================
       3. NOMBRE PRINCIPAL: "DYLAN"
       ========================================================= -->
  <g filter="url(#dropShadow)">
    <text
      x="400"
      y="346"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="96"
      font-weight="700"
      letter-spacing="7"
      fill="url(#forestGreen)"
      stroke="url(#greenHighlight)"
      stroke-width="1.3"
    >DYLAN</text>
  </g>

  <!-- =========================================================
       4. ORNAMENTO DOBLE ONDULADO EN COBRE
       ========================================================= -->
  <g transform="translate(400, 382)" filter="url(#softShadow)">
    <!-- Onda superior principal -->
    <path
      d="M -68,5
         C -42,-12 -12,-10 14,-2
         C 36,4 54,2 72,-12
         C 56,8 34,13 10,6
         C -14,-1 -40,-3 -68,5
         Z"
      fill="url(#copperMetal)"
    />
    <!-- Onda inferior secundaria -->
    <path
      d="M -46,10
         C -24,0 -4,3 14,9
         C 30,14 44,11 56,2
         C 44,16 28,20 10,14
         C -6,9 -24,7 -46,10
         Z"
      fill="url(#copperWarm)"
    />
  </g>

  <!-- =========================================================
       4. SUBTÍTULO CURVADO: "RESTAURANTE"
       ========================================================= -->
  <g filter="url(#softShadow)">
    <text
      font-family="'Segoe UI', 'Montserrat', 'Helvetica Neue', Arial, sans-serif"
      font-size="27"
      font-weight="600"
      letter-spacing="6"
      fill="url(#copperMetal)"
    >
      <textPath href="#restauranteArc" startOffset="50%" text-anchor="middle">
        RESTAURANTE
      </textPath>
    </text>
  </g>
</svg>